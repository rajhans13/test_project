version: 1
policy:
  targetBranch: refs/heads/main
  minimumReviewers: 2
  enforceMergeStrategy: squash
  statusChecks:
    - name: terraform-validate
      context: Terraform Validate
    - name: packer-validate
      context: Packer Validate
  buildValidation:
    - pipeline: os-upgrade
      displayName: OS Upgrade Pipeline
      manualQueueOnly: false
  branchNaming:
    regex: "^(feature|hotfix|release)/[A-Z]{3,}-\\d+(-[a-z0-9-]+)?$"
    helpText: "Branches must follow Gitflow naming convention with work item key, e.g. feature/ABC-123-add-ingress"
  autoReviewers:
    - Cloud-Security-Team
    - Platform-Networking
