trigger:
  branches:
    include:
      - feature/*
      - hotfix/*
      - release/*
  paths:
    include:
      - common/packer/*
      - im/terraform/**
      - .azure/pipelines/os-upgrade.yml

pr:
  branches:
    include:
      - main

variables:
  terraformVersion: 1.6.6
  packerVersion: 1.10.1
  azureServiceConnection: platform-landing-zone
  environmentName: platform-shared

stages:
  - stage: build
    displayName: Build Image Artifacts
    jobs:
      - job: packer_validate
        displayName: Validate Packer Template
        pool:
          vmImage: ubuntu-22.04
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.11'
          - script: |
              curl -fsSL https://releases.hashicorp.com/packer/${PACKER_VERSION}/packer_${PACKER_VERSION}_linux_amd64.zip -o packer.zip
              unzip -o packer.zip -d /usr/local/bin
            displayName: Install Packer
            env:
              PACKER_VERSION: $(packerVersion)
          - script: |
              packer init common/packer/ws2025.json
              packer validate -var "image_version=$(Build.BuildNumber)" common/packer/ws2025.json
            displayName: Packer validate
      - job: terraform_fmt
        displayName: Terraform Format & Validate
        pool:
          vmImage: ubuntu-22.04
        steps:
          - task: TerraformInstaller@1
            inputs:
              terraformVersion: $(terraformVersion)
          - script: |
              terraform -chdir=im/terraform fmt -recursive
              terraform -chdir=im/terraform validate
            displayName: Terraform fmt/validate

  - stage: plan
    displayName: Terraform Plan
    dependsOn: build
    condition: succeeded()
    jobs:
      - deployment: terraform_plan
        displayName: Terraform Plan
        environment: $(environmentName)
        strategy:
          runOnce:
            deploy:
              steps:
                - task: TerraformInstaller@1
                  inputs:
                    terraformVersion: $(terraformVersion)
                - task: AzureCLI@2
                  displayName: Terraform Init
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      terraform -chdir=im/terraform init -backend-config="key=$(Build.SourceBranchName).tfstate"
                - task: AzureCLI@2
                  displayName: Terraform Plan
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      terraform -chdir=im/terraform plan -out=tfplan
                - task: PublishPipelineArtifact@1
                  inputs:
                    targetPath: im/terraform/tfplan
                    artifact: terraform-plan

  - stage: apply
    displayName: Terraform Apply & Ansible Hardening
    dependsOn: plan
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: terraform_apply
        displayName: Terraform Apply
        environment:
          name: $(environmentName)
          resourceType: VirtualMachine
        strategy:
          runOnce:
            preDeploy:
              steps:
                - task: ManualValidation@0
                  inputs:
                    instructions: 'Approve Terraform apply into platform shared environment.'
                    onTimeout: reject
            deploy:
              steps:
                - task: TerraformInstaller@1
                  inputs:
                    terraformVersion: $(terraformVersion)
                - task: AzureCLI@2
                  displayName: Terraform Apply
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      terraform -chdir=im/terraform apply -auto-approve tfplan
                - task: UsePythonVersion@0
                  inputs:
                    versionSpec: '3.11'
                - script: |
                    python -m pip install ansible-core==2.16.2
                    ansible-galaxy collection install azure.azcollection
                  displayName: Install Ansible
                - script: |
                    ansible-playbook -i providers/inventory/hosts.yml etl/jobs/os-hardening.yml \
                      -e subscription_aliases="$(subscription_aliases)" \
                      -e firewall_policy_id="$(firewall_policy_id)"
                  displayName: Run Ansible hardening
            routeTraffic:
              steps: []
            postDeploy:
              steps:
                - task: AzureCLI@2
                  displayName: Upload Terraform State Metadata
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      terraform -chdir=im/terraform show -json tfplan > $(Pipeline.Workspace)/terraform-plan.json
                      az storage blob upload --account-name platformtfstate --container-name plans \
                        --name $(Build.BuildNumber)-plan.json --file $(Pipeline.Workspace)/terraform-plan.json --overwrite
